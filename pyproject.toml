[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lego"
version = "0.1.0"
description = "iOS Legacy Test Generator — hybrid tree-sitter + Claude pipeline that generates XCTest tests for legacy Swift/Objective-C codebases."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matheus Ruschel" }]
dependencies = [
    "click>=8.1",
    "anthropic>=0.39",
    "pydantic>=2.6",
    "tree-sitter>=0.23",
    "tree-sitter-swift>=0.6",
    "tree-sitter-objc>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
lego = "lego.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
